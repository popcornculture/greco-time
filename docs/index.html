<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Greco Time</title>

<!-- viewport-fit=cover + safe-area padding in CSS keeps the form clear of the notch and
     home bar. No maximum-scale: every input is >=16px, which is what actually stops
     Safari zooming on focus, so pinch-zoom stays available. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Chrome-less fullscreen launch from the home screen. Both spellings are needed:
     Apple honours the apple- prefixed one, everyone else the unprefixed one. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greco Time">
<meta name="theme-color" content="#00376A">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">

<!-- Theme applied before the stylesheet paints, inline and synchronous on purpose: read
     it in app.js instead and a phone forced to dark flashes a full white screen on every
     launch. Own localStorage key, so "Reset this device" does not undo the choice. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('gt.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private browsing — fall back to following the phone */ }
})();
</script>
</head>
<body>

<!-- ───────────────────────── Setup (first launch only) ───────────────────────── -->
<!-- The endpoint URL and PIN are entered here, never committed: this repo is public
     because GitHub Pages on a free account cannot serve from a private one. -->
<section id="setup" class="screen" hidden>
  <h1 class="setup-title">Greco Time</h1>
  <p class="setup-sub">One-time setup for this phone.</p>

  <label class="field">
    <span class="label">Server address</span>
    <input id="setup-endpoint" type="url" inputmode="url" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="https://script.google.com/…/exec">
    <div class="hint-row">
      <span class="hint">Filled in automatically if you opened the setup link.</span>
      <!-- Escape hatch: the endpoint is ~114 characters, which nobody should have to
           type on a phone if the link route fails for any reason. -->
      <button type="button" id="setup-paste" class="tiny">Paste</button>
    </div>
  </label>

  <label class="field">
    <span class="label">PIN</span>
    <input id="setup-pin" type="password" inputmode="numeric" autocomplete="off"
           placeholder="••••••">
  </label>

  <label class="field">
    <span class="label">Who is using this phone?</span>
    <select id="setup-timekeeper">
      <option value="">Connect first…</option>
    </select>
  </label>

  <p id="setup-error" class="error" hidden></p>

  <button id="setup-connect" class="primary">Connect</button>
  <button id="setup-save" class="primary" hidden>Start using Greco Time</button>

  <!-- Build stamp. Exists so "which version is this phone actually running?" is
       answerable at a glance instead of guessed at. Filled from BUILD in app.js, which is
       the single source of truth — it also appears in the app footer, and two hardcoded
       strings would drift. -->
  <p class="build" id="build-setup"></p>
</section>

<!-- ───────────────────────────── Main entry form ───────────────────────────── -->
<section id="app" class="screen" hidden>

  <header class="topbar">
    <div class="who">
      <strong id="who-name">—</strong>
      <span id="who-test" class="test-tag" hidden>TEST</span>
    </div>
    <button id="pending" class="pending" hidden aria-live="polite"></button>
  </header>

  <!-- Suggestions built from the day's calendar. Hidden unless there is something to
       offer, so a day with no appointments costs no screen space. Tapping one fills the
       form in; nothing is ever filed without a deliberate Save. -->
  <section id="cal" class="cal" hidden>
    <div class="cal-head">
      <h2>From your calendar</h2>
      <button type="button" id="cal-hide" class="tiny">Hide</button>
    </div>
    <ul id="cal-list" class="cal-list"></ul>
    <p id="cal-note" class="hint" hidden></p>
  </section>

  <form id="entry-form" novalidate>

    <!-- Time or expense. Deliberately a visible two-state control that resets to Time
         after every save, rather than a checkbox that stays ticked: a sticky "expense"
         tick is how you end up filing an hour of work as $1.00. -->
    <div class="field">
      <span class="label" id="kind-label">What are you billing</span>
      <div class="segmented kinds" role="radiogroup" aria-labelledby="kind-label">
        <button type="button" class="seg kind" role="radio" data-kind="time"
                aria-checked="true">Time</button>
        <button type="button" class="seg kind" role="radio" data-kind="expense"
                aria-checked="false">Expense</button>
      </div>
    </div>

    <!-- Row 1: matter type label + date, then the buttons full-width beneath.
         "Conservatorship" cannot fit in a quarter of a shared row on a 320px phone, so
         the four options sit in a 2x2 grid spanning the full width instead. -->
    <div class="field">
      <div class="label-row">
        <span class="label" id="matter-label">Matter</span>
        <label class="date-inline">
          <span class="label">Date</span>
          <input id="date" type="date">
        </label>
      </div>
      <div class="segmented" role="radiogroup" aria-labelledby="matter-label">
        <button type="button" class="seg" role="radio" data-matter="Criminal"        aria-checked="false">Criminal</button>
        <button type="button" class="seg" role="radio" data-matter="Civil"           aria-checked="false">Civil</button>
        <button type="button" class="seg" role="radio" data-matter="Family"          aria-checked="false">Family</button>
        <button type="button" class="seg" role="radio" data-matter="Conservatorship" aria-checked="false">Conservatorship</button>
      </div>
    </div>

    <!-- Row 2: client, with autocomplete -->
    <div class="field">
      <div class="label-row">
        <!-- "Client/Case" because the value must be MyCase's Case Name, which is
             sometimes the client and sometimes a caption like "People vs Aaron". -->
        <span class="label">Client/Case</span>
        <label class="newclient">
          <input id="new-client" type="checkbox">
          <span>new client</span>
        </label>
      </div>
      <div class="combo">
        <input id="client" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="done"
               placeholder="Start typing a name…">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <span id="client-state" class="hint" hidden></span>
    </div>

    <!-- Row 3a: time in decimal hours. 0.1 = 6 minutes, so 1.5 = 90 minutes. -->
    <div class="field" id="time-field">
      <div class="label-row">
        <span class="label">Time</span>
        <span id="time-readout" class="readout">—</span>
      </div>
      <input id="hours" type="text" inputmode="decimal" autocomplete="off"
             placeholder="0.0" class="hours-input">
      <div class="chips" aria-label="Common amounts">
        <button type="button" class="chip" data-hours="0.1">0.1</button>
        <button type="button" class="chip" data-hours="0.2">0.2</button>
        <button type="button" class="chip" data-hours="0.3">0.3</button>
        <button type="button" class="chip" data-hours="0.5">0.5</button>
        <button type="button" class="chip" data-hours="1.0">1.0</button>
      </div>
    </div>

    <!-- Row 3b: the expense amount, shown instead of Time. inputmode="decimal" rather
         than a number input: iOS gives a number pad either way, and a number input adds
         spinners and silently discards anything it dislikes. -->
    <div class="field" id="amount-field" hidden>
      <div class="label-row">
        <span class="label">Amount</span>
        <span id="amount-readout" class="readout">—</span>
      </div>
      <div class="money">
        <span class="money-sign" aria-hidden="true">$</span>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0.00" class="hours-input">
      </div>
      <label class="newclient nonbill">
        <input id="nonbillable" type="checkbox">
        <span>do not bill this to the client</span>
      </label>
    </div>

    <!-- Optional for time, required for an expense: the note is the line item the client
         reads on the bill, and "$450" on its own is unbillable in practice. -->
    <label class="field">
      <span class="label">Description <span class="muted" id="desc-optional">— optional</span></span>
      <input id="description" type="text" autocomplete="off" enterkeyhint="done"
             placeholder="Phone call w/ DA…">
    </label>

    <p id="form-error" class="error" hidden></p>

    <button id="save" type="submit" class="primary big">Save entry</button>
  </form>

  <!-- Today's entries, so a fat-fingered 15 that should have been 1.5 is obvious
       immediately rather than at 6pm when the digest lands. -->
  <section class="today">
    <div class="today-head">
      <h2>Today</h2>
      <strong id="today-total">0.0 hrs</strong>
    </div>
    <ul id="today-list" class="today-list"></ul>
    <p id="today-empty" class="muted small">Nothing logged yet today.</p>
  </section>

  <footer class="footer">
    <!-- System follows the phone's own appearance setting, which is what most people
         want; the explicit options exist for reading a screen in a dark courtroom or in
         direct sun, where the phone-wide setting is the wrong one to change. -->
    <div class="theme" role="radiogroup" aria-label="Appearance">
      <button type="button" class="theme-btn" data-theme-choice="system" aria-checked="true"  role="radio">Auto</button>
      <button type="button" class="theme-btn" data-theme-choice="light"  aria-checked="false" role="radio">Light</button>
      <button type="button" class="theme-btn" data-theme-choice="dark"   aria-checked="false" role="radio">Dark</button>
    </div>
    <button id="reset-device" class="linkish" type="button">Reset this device</button>
    <!-- Also here, not just on the setup screen: once a phone is set up the setup screen is
         never seen again, so "did the update actually land on this phone?" was unanswerable
         on exactly the devices where it gets asked. -->
    <p class="build" id="build-app"></p>
  </footer>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="names.js"></script>
<script src="app.js"></script>
</body>
</html>
